<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drishti Font Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <a href="./index.html">DRISHTI FONT CONVERTER</a>
    </div>
    <div class="content">
        <div class="content1">
            <textarea onchange="textType()" name="" id="text1"></textarea>
        </div>
        <div class="content2">
            <select onchange="fontChange()" name="" id="font_selector">
                <option value="">--SELECT--</option>
                <option value="Preeti">Preeti</option>
                <option value="Ganess">Ganess</option>
                <option value="Aakriti">Aakriti</option>
                <option value="ARAP 002">ARAP 002</option>
                <option value="0001 ARAP  BK">0001 ARAP BK</option>
                <option value="0022 ARAP">0022 ARAP</option>
                <option value="0010 ARAP">0010 ARAP</option>
                <hr width="10">
                <option value="Kalam">Kalam</option>
                <option value="Khand">Khand</option>
                <option value="Karma">Karma</option>
                <option value="Poppins">Poppins</option>
                <option value="Yatra One">Yatra One</option>
                <option value="Rozha One">Rozha One</option>

            </select>
            <textarea name="" id="text2"></textarea>
        </div>
    </div>
    <div class="developer">
        Developed by &copy; <a href="https://www.facebook.com/shrestha.umang.9/" target="_blank">UMANGA SHRESTHA</a>
    </div>
</body>
<script src="script.js"></script>

</html>
